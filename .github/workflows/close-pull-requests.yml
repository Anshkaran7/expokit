name: Close pull requests

# Read-only mirror: close PRs opened from other people's forks so contributors use issues instead.
# PRs from this repo (branches) and from Anshkaran7's fork stay open so Scorecard can see CI and review.
on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.user.login != 'Anshkaran7'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for this! 🙏 This repository is a read-only mirror of ExpoKit — it is synced automatically from the main repository, so pull requests can't be merged here.

          Please open an issue (https://github.com/$REPO/issues/new/choose) and paste your diff or a link to this branch. It will be applied upstream with credit and show up here in the next sync."
