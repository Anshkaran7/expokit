name: Release

# Creates a GitHub Release (and tag) for @expokit/cli and expo-charts once the version in
# packages/*/package.json is published on npm — never for a version that only exists in the repo.
# Runs after every sync, after every Publish run, every 6 hours (so a manual publish shows up without a push) and on demand.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Release published versions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ vars.RELEASE_DRY_RUN }}
        run: bash .github/workflows/release.sh
