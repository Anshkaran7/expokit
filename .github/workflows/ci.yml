name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: CLI tests
        run: npm test
      - name: Typecheck components
        run: npm run typecheck
      - name: Build expo-charts
        run: npm run build -w expo-charts
