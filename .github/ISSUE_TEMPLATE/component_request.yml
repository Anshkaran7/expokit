name: Component request
description: Suggest a new component, block or chart.
labels: [component request]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Range slider
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What should it do?
      description: Where you'd use it, and links or screenshots of apps that have it.
    validations:
      required: true
